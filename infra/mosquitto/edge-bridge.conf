# Mosquitto on the Raspberry Pi: local broker for the meter and plugs, bridged
# to the cloud broker over TLS. Copy to /etc/mosquitto/conf.d/ on the Pi.
listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd

connection voltix-cloud
address CLOUD_HOST:8883
remote_username voltix
remote_password CHANGE_ME
bridge_cafile /etc/ssl/certs/ca-certificates.crt
cleansession false
restart_timeout 5 30
# telemetry up, commands down
topic tele/# out 1
topic stat/# out 1
topic voltix/# out 1
topic cmnd/# in 1
