# VOLTIX broker. Username and password are always required.
persistence true
persistence_location /mosquitto/data/
allow_anonymous false
password_file /mosquitto/data/passwd

listener 1883

# TLS listener. Put ca.crt, server.crt and server.key in /mosquitto/certs and
# uncomment; then set VOLTIX_MQTT_PORT=8883 and VOLTIX_MQTT_TLS=1.
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
