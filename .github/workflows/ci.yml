name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" paho-mqtt
      - run: ruff check app tests ../edge ../tools
      - run: mypy app
      - run: pytest -q
      - run: pip-audit || true

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx eslint src e2e
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -e backend
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium && npm run build
      - name: Start API and web
        run: |
          cd backend && VOLTIX_SIMULATE=1 VOLTIX_SEED_DEMO=1 VOLTIX_DEV_LOGIN=1 VOLTIX_OPEN_METEO_ENABLED=0 \
            uvicorn app.main:app --port 8000 &
          cd frontend && npx next start -p 3000 &
          npx --yes wait-on http://localhost:8000/api/health http://localhost:3000
      - run: cd frontend && npx playwright test --trace off
